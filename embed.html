<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>Next rocket launch — embed</title>
<style>
  :root{--bg:#fff;--text:#0f172a;--muted:#5b6472;--accent:#2563eb;--line:#e6e8ee}
  [data-theme="dark"]{--bg:#0b0f1a;--text:#e8ebf5;--muted:#9aa3bd;--accent:#3b82f6;--line:#1f2637}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:Inter,system-ui,sans-serif;background:var(--bg);color:var(--text);
    display:flex;align-items:center;justify-content:center;min-height:100vh;padding:14px}
  a{color:inherit;text-decoration:none}
  .card{text-align:center;max-width:420px;width:100%}
  .k{font-size:.72rem;color:var(--accent);font-weight:600;margin-bottom:4px}
  .cd{font-size:clamp(1.6rem,7vw,2.4rem);font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
  .n{font-size:.95rem;font-weight:600;margin-top:4px;line-height:1.35}
  .m{font-size:.78rem;color:var(--muted);margin-top:3px}
  .via{display:inline-block;font-size:.68rem;color:var(--muted);margin-top:10px;padding-top:8px;border-top:1px solid var(--line)}
  .via b{color:var(--accent)}
</style>
</head>
<body>
<a class="card" href="https://rocketlaunchtracker.com/" target="_blank" rel="noopener" id="wrap">
  <div class="k">NEXT ROCKET LAUNCH</div>
  <div class="cd" id="cd">—</div>
  <div class="n" id="n">Loading…</div>
  <div class="m" id="m"></div>
  <span class="via">tracked by <b>RocketLaunchTracker.com</b></span>
</a>
<script>
(function(){
  const qs = new URLSearchParams(location.search);
  if (qs.get("theme") === "dark") document.documentElement.dataset.theme = "dark";
  let next = null;
  const pad = n => String(n).padStart(2, "0");
  function tick(){
    if (!next) return;
    let d = next.t - Date.now();
    const past = d < 0; if (past) d = -d;
    const el = document.getElementById("cd");
    el.textContent = (past ? "T+" : "T−") +
      Math.floor(d/86400000) + "d " + pad(Math.floor(d/3600000)%24) + ":" +
      pad(Math.floor(d/60000)%60) + ":" + pad(Math.floor(d/1000)%60);
  }
  fetch("data/launches.json").then(r => r.json()).catch(() =>
    fetch("https://ll.thespacedevs.com/2.3.0/launches/upcoming/?limit=5&mode=list").then(r => r.json())
  ).then(j => {
    const L = (j.results || []).map(r => ({
      name: (r.mission && r.mission.name) || r.name, t: +new Date(r.net),
      loc: r.pad && (r.pad.location && r.pad.location.name || r.pad.location) || ""
    })).filter(l => l.t > Date.now()).sort((a,b) => a.t - b.t);
    if (!L.length){ document.getElementById("n").textContent = "No upcoming launches found"; return; }
    next = L[0];
    document.getElementById("n").textContent = next.name;
    document.getElementById("m").textContent = new Date(next.t).toLocaleString() + (next.loc ? " · " + next.loc : "");
    tick(); setInterval(tick, 1000);
  }).catch(() => { document.getElementById("n").textContent = "Couldn't load launch data"; });
})();
</script>
</body>
</html>
